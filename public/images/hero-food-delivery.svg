<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe4d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="burgerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c99a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="friesGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4a460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradient)" stroke="#f0d9c8" stroke-width="2"/>

  <!-- Burger bun top (top-left) -->
  <g transform="translate(80, 100)">
    <!-- Top bun -->
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="#d4a574" stroke="#c99a6e" stroke-width="1.5"/>
    <path d="M -35 -5 Q -30 -25 0 -28 Q 30 -25 35 -5" fill="#e8b887" stroke="none"/>
    <!-- Sesame seeds -->
    <circle cx="-15" cy="-12" r="3" fill="#f5deb3"/>
    <circle cx="5" cy="-18" r="3" fill="#f5deb3"/>
    <circle cx="20" cy="-10" r="3" fill="#f5deb3"/>
  </g>

  <!-- French Fries (top-right) -->
  <g transform="translate(300, 120)">
    <!-- Fries container -->
    <rect x="-20" y="0" width="40" height="50" rx="4" fill="#d35400" stroke="#c23a00" stroke-width="1.5"/>
    <!-- Individual fries -->
    <rect x="-15" y="-35" width="8" height="40" rx="2" fill="url(#friesGradient)" stroke="#e67e22" stroke-width="0.5"/>
    <rect x="-4" y="-40" width="8" height="45" rx="2" fill="url(#friesGradient)" stroke="#e67e22" stroke-width="0.5"/>
    <rect x="7" y="-38" width="8" height="43" rx="2" fill="url(#friesGradient)" stroke="#e67e22" stroke-width="0.5"/>
    <!-- Salt particles -->
    <circle cx="-10" cy="-30" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="5" cy="-35" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="15" cy="-32" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Drink/Beverage (bottom-right) -->
  <g transform="translate(310, 280)">
    <!-- Cup body -->
    <path d="M -25 0 L -22 40 Q -22 45 -18 45 L 18 45 Q 22 45 22 40 L 25 0 Z" fill="#f4a460" stroke="#ff8c42" stroke-width="1.5"/>
    <!-- Cup rim -->
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="#ffa500" stroke="#ff8c42" stroke-width="1"/>
    <!-- Liquid inside -->
    <path d="M -20 5 L -18 38 Q -18 42 -15 42 L 15 42 Q 18 42 18 38 L 20 5 Z" fill="#ffd700" opacity="0.7"/>
    <!-- Straw -->
    <line x1="8" y1="-10" x2="2" y2="35" stroke="#ff69b4" stroke-width="3" stroke-linecap="round"/>
    <!-- Straw stripes -->
    <line x1="10" y1="-5" x2="4" y2="30" stroke="#ff1493" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Scooter/Delivery symbol (center-bottom) -->
  <g transform="translate(150, 280)">
    <!-- Scooter platform -->
    <rect x="-40" y="0" width="80" height="15" rx="3" fill="#ff8c42" stroke="#ff6b35" stroke-width="1.5"/>
    <!-- Scooter wheels -->
    <circle cx="-25" cy="20" r="12" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="25" cy="20" r="12" fill="none" stroke="#666" stroke-width="2"/>
    <!-- Wheel hubs -->
    <circle cx="-25" cy="20" r="5" fill="#ff8c42"/>
    <circle cx="25" cy="20" r="5" fill="#ff8c42"/>
    <!-- Scooter handle/column -->
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#ff6b35" stroke-width="3" stroke-linecap="round"/>
    <!-- Handles -->
    <path d="M -20 -35 L 0 -32 L 20 -35" stroke="#ff6b35" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Speed lines -->
    <line x1="-60" y1="15" x2="-75" y2="12" stroke="#ff8c42" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-55" y1="25" x2="-72" y2="28" stroke="#ff8c42" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Top accent elements -->
  <circle cx="100" cy="60" r="8" fill="#ff8c42" opacity="0.3"/>
  <circle cx="320" cy="80" r="6" fill="#ff8c42" opacity="0.2"/>
  <circle cx="60" cy="280" r="7" fill="#ff8c42" opacity="0.25"/>

  <!-- Star decoration -->
  <g transform="translate(340, 140)">
    <polygon points="0,-8 2.4,-2.4 8,-0.8 3.2,3.2 4.8,9.2 0,5.6 -4.8,9.2 -3.2,3.2 -8,-0.8 -2.4,-2.4" fill="#ff8c42" opacity="0.4"/>
  </g>
</svg>